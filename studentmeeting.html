  <style>

/* ===== STUDENT MEETING GRID REDESIGN ===== */

/* --- Grid layout --- */
#studentMeetingRoot .roster {
  grid-template-columns: 90px 90px 110px minmax(260px, 1.1fr) minmax(280px, 1.3fr) minmax(260px, 1.1fr);
  row-gap: 0;
  column-gap: 0;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid #e2e8f0;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
}

/* --- Header row --- */
#studentMeetingRoot .roster__head {
  background: #f8fafc;
  border-bottom: 2px solid #e2e8f0;
  padding: 12px 8px;
  text-align: center;
}

#studentMeetingRoot .head {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0;
  border-radius: 0;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  border: none;
  background: transparent;
  box-shadow: none;
  white-space: nowrap;
}

#studentMeetingRoot .head i { font-size: 12px; opacity: 0.7; }

/* Header colors — subtle text color only */
#studentMeetingRoot .head--day   { color: #475569; }
#studentMeetingRoot .head--time  { color: #475569; }
#studentMeetingRoot .head--note  { color: #475569; }
#studentMeetingRoot .head--main  { color: #4338ca; }
#studentMeetingRoot .head--other { color: #c2410c; }
#studentMeetingRoot .head--assign { color: #be123c; }


/* --- Day label: sidebar accent style --- */
#studentMeetingRoot .roster__day {
  background: #fff;
  border-radius: 0;
  box-shadow: none;
  padding: 32px 8px;
  font-weight: 800;
  font-size: 13px;
  color: #1e293b;
  border-right: 1px solid #f1f5f9;
  border-bottom: 1px solid #f1f5f9;
  position: relative;
  display: flex;              /* NEW: explicit flex */
  flex-direction: column;     /* NEW: stack day name + HÔM NAY vertically */
  align-items: center;
  justify-content: center;
  text-align: center;
  white-space: nowrap;        /* NEW: keep "Thứ tư" on one line */
  gap: 4px;                   /* NEW: small space between name and HÔM NAY */
}

/* Colored left accent bar per day */
#studentMeetingRoot .roster__day::before {
  content: '';
  position: absolute;
  left: 0;
  top: 8px;
  bottom: 8px;
  width: 4px;
  border-radius: 0 4px 4px 0;
}
#studentMeetingRoot .roster__day.day-1::before { background: #3b82f6; }
#studentMeetingRoot .roster__day.day-2::before { background: #10b981; }
#studentMeetingRoot .roster__day.day-3::before { background: #f59e0b; }
#studentMeetingRoot .roster__day.day-4::before { background: #f97316; }
#studentMeetingRoot .roster__day.day-5::before { background: #8b5cf6; }
#studentMeetingRoot .roster__day.day-6::before { background: #14b8a6; }
#studentMeetingRoot .roster__day.day-7::before { background: #f43f5e; }

/* Remove pastel backgrounds from day labels */
#studentMeetingRoot .roster__day.day-1,
#studentMeetingRoot .roster__day.day-2,
#studentMeetingRoot .roster__day.day-3,
#studentMeetingRoot .roster__day.day-4,
#studentMeetingRoot .roster__day.day-5,
#studentMeetingRoot .roster__day.day-6,
#studentMeetingRoot .roster__day.day-7 {
  background: #fff;
  border-color: #f1f5f9;
}


/* --- Cells: clean white --- */
#studentMeetingRoot .roster__cell {
  background: #fff;
  border-radius: 0;
  box-shadow: none;
  padding: 22px 10px;        /* was 12px → more vertical breathing room */
  border-right: 1px solid #f1f5f9;
  border-bottom: 1px solid #f1f5f9;
  min-height: 72px;          /* was 52px → taller minimum row */
}

/* Remove pastel backgrounds from cells */
#studentMeetingRoot .roster__cell.day-1,
#studentMeetingRoot .roster__cell.day-2,
#studentMeetingRoot .roster__cell.day-3,
#studentMeetingRoot .roster__cell.day-4,
#studentMeetingRoot .roster__cell.day-5,
#studentMeetingRoot .roster__cell.day-6,
#studentMeetingRoot .roster__cell.day-7 {
  background: #fff;
  border-color: #f1f5f9;
}

/* Remove borders on last column */
#studentMeetingRoot .roster__cell:nth-child(6n) {
  border-right: none;
}


/* --- Row separator: subtle --- */
#studentMeetingRoot .roster__sep {
  grid-column: 1 / -1;
  height: 0;
  position: relative;
}
#studentMeetingRoot .roster__sep::after {
  display: none;
}


/* --- Today's row highlight --- */
#studentMeetingRoot .roster__day.day-today,
#studentMeetingRoot .roster__cell.day-today {
  background: #fefce8 !important;
}
#studentMeetingRoot .roster__day.day-today {
  font-weight: 900;
  color: #92400e;
}
#studentMeetingRoot .roster__day.day-today::after {
  content: 'HÔM NAY';
  display: block;
  font-size: 9px;
  font-weight: 800;
  color: #d97706;
  letter-spacing: 0.5px;
  margin-top: 0;                 /* gap on parent now handles spacing */
  padding: 2px 6px;
  background: #fef3c7;           /* soft amber pill background */
  border-radius: 6px;
  line-height: 1.2;
}


/* --- Centered columns --- */
#studentMeetingRoot .roster__cell.roster__cell--center {
  align-items: center;
  text-align: center;
}
#studentMeetingRoot .roster__cell.roster__cell--center .badge,
#studentMeetingRoot .roster__cell.roster__cell--center .time-pill {
  align-self: center;
}


/* --- Time pill refinement --- */
#studentMeetingRoot .time-pill {
  font-size: 15px;
  font-weight: 800;
  padding: 6px 14px;
  border-radius: 10px;
  background: #0f172a; /* fallback */
  color: #fff;
  border: none;
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.15);
}
#studentMeetingRoot .time-pill i {
  font-size: 12px;
  opacity: 0.85;
}

/* Per-day time pill colors (match the day accent bar) */
#studentMeetingRoot .roster__cell.day-1 .time-pill { background: #3b82f6; box-shadow: 0 2px 6px rgba(59, 130, 246, 0.3); }   /* Mon — blue */
#studentMeetingRoot .roster__cell.day-2 .time-pill { background: #10b981; box-shadow: 0 2px 6px rgba(16, 185, 129, 0.3); }   /* Tue — green */
#studentMeetingRoot .roster__cell.day-3 .time-pill { background: #f59e0b; box-shadow: 0 2px 6px rgba(245, 158, 11, 0.3); }   /* Wed — amber */
#studentMeetingRoot .roster__cell.day-4 .time-pill { background: #f97316; box-shadow: 0 2px 6px rgba(249, 115, 22, 0.3); }   /* Thu — orange */
#studentMeetingRoot .roster__cell.day-5 .time-pill { background: #8b5cf6; box-shadow: 0 2px 6px rgba(139, 92, 246, 0.3); }   /* Fri — purple */
#studentMeetingRoot .roster__cell.day-6 .time-pill { background: #14b8a6; box-shadow: 0 2px 6px rgba(20, 184, 166, 0.3); }   /* Sat — teal */
#studentMeetingRoot .roster__cell.day-7 .time-pill { background: #f43f5e; box-shadow: 0 2px 6px rgba(244, 63, 94, 0.3); }   /* Sun — rose */


/* --- "Chưa tới giờ" text: styled info badge --- */
#studentMeetingRoot .teacher-off-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 12.5px;
  font-weight: 600;
  color: #64748b;
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  line-height: 1.3;
}
#studentMeetingRoot .teacher-off-badge i {
  color: #94a3b8;
  font-size: 13px;
}


/* --- Badge refinements --- */
#studentMeetingRoot .badge--main,
#studentMeetingRoot .badge--aux {
  font-size: 11.5px;
  padding: 5px 12px;
  border-radius: 8px;
}


/* --- Responsive --- */
@media (max-width: 720px) {
  #studentMeetingRoot .roster {
    grid-template-columns: 72px 88px 110px minmax(240px, 1fr) minmax(260px, 1.1fr) minmax(240px, 1fr);
  }
}

/* === Wrap card content + breakout rooms so nothing gets clipped === */

/* Allow the table to scroll horizontally if total min-width exceeds the screen */
#studentMeetingRoot .roster {
  overflow-x: auto;
}

/* Teacher card header: let avatar/name and the "Meeting chính" button wrap onto a new line on narrow widths */
#studentMeetingRoot .tmc-header {
  flex-wrap: wrap;
  row-gap: 8px;
}

/* The "Meeting chính" button: don't shrink, let it drop down */
#studentMeetingRoot .tmc-main-btn {
  flex-shrink: 0;
}

/* Card body shouldn't overflow its cell */
#studentMeetingRoot .tmc-card {
  max-width: 100%;
  box-sizing: border-box;
}

/* Breakout rooms: wrap to multiple rows when there isn't enough space */
#studentMeetingRoot .tmc-rooms,
#studentMeetingRoot .tmc-rooms-list {
  flex-wrap: wrap;
  row-gap: 6px;
}

/* Each breakout room button: don't get squished */
#studentMeetingRoot .tmc-room-btn {
  flex-shrink: 0;
}

/* Long teacher names/emails: wrap nicely instead of overflowing */
#studentMeetingRoot .tmc-name,
#studentMeetingRoot .tmc-status {
  word-break: break-word;
  overflow-wrap: anywhere;
}


/* === tansinh sm-v3 BEGIN (10 Oct 2026) — week agenda ("Vào lớp với ai?") === */

/* the old grid wrapper becomes a plain container */
#studentMeetingRoot .roster {
  display: block;
  grid-template-columns: none;
  border: none;
  box-shadow: none;
  overflow: visible;
  border-radius: 0;
  background: transparent;
}
#studentMeetingRoot .section-title { margin-bottom: 6px; }

/* header line under the title */
.ag__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 0 0 16px; }
.ag__sub { font-size: 13px; color: #64748b; }
.ag__call {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 14px; border-radius: 999px;
  border: 1px solid #cbd5e1; background: #fff; color: #0f172a !important;
  font-size: 13px; font-weight: 700; text-decoration: none !important;
  transition: background .15s ease, border-color .15s ease;
}
.ag__call:hover { background: #f8fafc; border-color: #94a3b8; }
.ag__call i { color: #2563eb; }

/* one row = date rail on the left + body on the right */
.ag__row { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 0 18px; }
.ag__rail { position: relative; text-align: right; padding: 10px 16px 0 0; border-right: 2px solid #e2e8f0; }
.ag__row--last .ag__rail { border-right-color: transparent; }
.ag__day { font-size: 14px; font-weight: 800; color: #1e293b; line-height: 1.3; }
.ag__date { font-size: 12px; color: #94a3b8; font-weight: 600; margin-top: 2px; }
.ag__dot {
  position: absolute; right: -6px; top: 14px;
  width: 10px; height: 10px; border-radius: 50%;
  background: #fff; border: 2px solid #94a3b8; box-sizing: border-box;
}
.ag__body { padding: 4px 0 18px; min-width: 0; }
.ag__row--last .ag__body { padding-bottom: 6px; }

/* today: amber rail */
.ag__row--today .ag__rail { border-right-color: #f59e0b; }
.ag__row--today .ag__day { color: #92400e; }
.ag__row--today .ag__date { color: #b45309; }
.ag__row--today .ag__dot { right: -7px; width: 12px; height: 12px; top: 13px; background: #f59e0b; border-color: #f59e0b; }

/* day colours on the dots and time pills (same palette as the old grid) */
.ag__row.day-1 .ag__dot { border-color: #3b82f6; }  .ag__row.day-1 .time-pill { background: #3b82f6; box-shadow: 0 2px 6px rgba(59,130,246,.3); }
.ag__row.day-2 .ag__dot { border-color: #10b981; }  .ag__row.day-2 .time-pill { background: #10b981; box-shadow: 0 2px 6px rgba(16,185,129,.3); }
.ag__row.day-3 .ag__dot { border-color: #f59e0b; }  .ag__row.day-3 .time-pill { background: #f59e0b; box-shadow: 0 2px 6px rgba(245,158,11,.3); }
.ag__row.day-4 .ag__dot { border-color: #f97316; }  .ag__row.day-4 .time-pill { background: #f97316; box-shadow: 0 2px 6px rgba(249,115,22,.3); }
.ag__row.day-5 .ag__dot { border-color: #8b5cf6; }  .ag__row.day-5 .time-pill { background: #8b5cf6; box-shadow: 0 2px 6px rgba(139,92,246,.3); }
.ag__row.day-6 .ag__dot { border-color: #14b8a6; }  .ag__row.day-6 .time-pill { background: #14b8a6; box-shadow: 0 2px 6px rgba(20,184,166,.3); }
.ag__row.day-7 .ag__dot { border-color: #f43f5e; }  .ag__row.day-7 .time-pill { background: #f43f5e; box-shadow: 0 2px 6px rgba(244,63,94,.3); }
.ag__row--today .ag__dot { border-color: #f59e0b !important; }
#studentMeetingRoot .ag .time-pill { font-size: 14px; padding: 5px 12px; }

/* a compact planned slot (not today) */
.ag__slot {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px;
  padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff;
  font-size: 13px; color: #1e293b;
}
.ag__slot + .ag__slot, .ag__note + .ag__slot { margin-top: 8px; }
.ag__who { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.ag__who b { font-weight: 700; }
.ag__role { font-size: 11.5px; font-weight: 600; color: #64748b; }
.ag__who--sub, .ag__who--sub .ag__role { color: #5b21b6; }
.ag__struck { text-decoration: line-through; color: #9a3412; font-weight: 600; }
.ag__note { margin: 6px 2px 0; font-size: 12px; color: #64748b; display: flex; gap: 6px; align-items: flex-start; }
.ag__note i { margin-top: 2px; }

/* today's expanded card: the strip is the card's header band */
.ag__card { border: 1px solid #e2e8f0; border-radius: 14px; background: #fff; overflow: hidden; box-shadow: 0 4px 18px rgba(15, 23, 42, .05); }
.ag__card + .ag__card { margin-top: 10px; }
.ag__card--ok       { border-color: #a7f3d0; }
.ag__card--soon     { border-color: #fde68a; }
.ag__card--sub      { border-color: #ddd6fe; }
.ag__card--assigned { border-color: #fecdd3; }
.ag__card--fallback { border-color: #fed7aa; }
.ag__card--call     { border-color: #fecaca; }
.ag__card > .sm-strip { border-radius: 0; margin: 0; border-width: 0 0 1px 0; padding: 11px 14px; font-size: 13.5px; }
.ag__cardbody { padding: 12px 14px 14px; }
.ag__slotmeta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 2px; }
.ag__noclass { font-size: 13px; color: #64748b; display: inline-flex; align-items: center; gap: 6px; }
.ag__others { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #e2e8f0; }
.ag__empty { padding: 4px 0 8px; }

/* flatten the meeting cards inside the agenda (the card header band already carries the colour) */
#studentMeetingRoot .ag .tmc-card { background: #fff; border-color: #e2e8f0; margin-top: 8px; }
#studentMeetingRoot .ag .tmc-card:hover { border-color: #c7d2fe; }
#studentMeetingRoot .ag .tmc-card--not-yet { opacity: .85; }
#studentMeetingRoot .ag .tmc-rooms { border-top-color: #e2e8f0; }

/* rooms shown under the teacher's own card */
.sm-rooms { margin: 8px 0 0; padding: 10px 12px; border: 1px dashed #99f6e4; border-radius: 10px; background: #f0fdfa; }
.sm-rooms__label { font-size: 11px; font-weight: 700; color: #0f766e; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .3px; }
.sm-rooms__grid { grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); }

/* the status strip: one coloured sentence per class slot */
.sm-strip {
  display: flex; gap: 8px; align-items: flex-start;
  padding: 9px 12px; border-radius: 10px;
  font-size: 13px; line-height: 1.45; font-weight: 500;
  margin-bottom: 4px; border: 1px solid transparent;
}
.sm-strip i { margin-top: 2px; flex-shrink: 0; }
.sm-strip b { font-weight: 800; }
.sm-strip--ok       { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
.sm-strip--soon     { background: #fffbeb; border-color: #fde68a; color: #92400e; }
.sm-strip--sub      { background: #f5f3ff; border-color: #ddd6fe; color: #5b21b6; }
.sm-strip--assigned { background: #fff1f2; border-color: #fecdd3; color: #9f1239; }
.sm-strip--fallback { background: #fff7ed; border-color: #fed7aa; color: #9a3412; }
.sm-strip--call     { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
.sm-strip--info     { background: #f8fafc; border-color: #e2e8f0; color: #64748b; }
.sm-strip--off      { background: #f1f5f9; border-color: #e2e8f0; color: #475569; }

/* labelled groups of cards */
.sm-section { margin-top: 10px; }
.sm-section__label {
  font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px;
  color: #64748b; margin: 0 0 0 2px; display: flex; align-items: center; gap: 5px;
}
.sm-section--assigned .sm-section__label { color: #be123c; }
.sm-section--sub      .sm-section__label { color: #7c3aed; }
.sm-section--fallback .sm-section__label { color: #c2410c; }
.sm-section--main     .sm-section__label { color: #4338ca; }
.sm-section--breakout .sm-section__label { color: #0f766e; }
.sm-section--other    .sm-section__label { color: #c2410c; }

/* the call-for-support badge */
.sm-call {
  margin-top: 10px; padding: 12px 14px; border-radius: 12px;
  border: 1px solid #fecaca; background: #fef2f2;
}
.sm-call--soft { border-color: #e2e8f0; background: #f8fafc; }
.sm-call__text { font-size: 13px; color: #7f1d1d; font-weight: 600; line-height: 1.45; margin-bottom: 8px; }
.sm-call__text i { color: #dc2626; margin-right: 4px; }
.sm-call--soft .sm-call__text { color: #334155; }
.sm-call--soft .sm-call__text i { color: #64748b; }
.sm-call__btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 16px; border-radius: 999px;
  background: #dc2626; color: #fff !important; font-weight: 800; font-size: 13px;
  text-decoration: none !important;
  box-shadow: 0 3px 10px rgba(220, 38, 38, .3);
  animation: smCallPulse 2s ease-in-out infinite;
  transition: transform .15s ease;
}
.sm-call__btn:hover { transform: translateY(-1px); }
.sm-call--soft .sm-call__btn { background: #4f8cff; box-shadow: 0 3px 10px rgba(79, 140, 255, .3); animation: none; }
@keyframes smCallPulse {
  0%, 100% { box-shadow: 0 3px 10px rgba(220, 38, 38, .3); }
  50%      { box-shadow: 0 3px 18px rgba(220, 38, 38, .55); }
}
.sm-call__hint { margin-top: 8px; font-size: 11.5px; color: #64748b; line-height: 1.4; }

/* a teacher we cannot send the learner to: red = off, grey = no room / no shift */
#studentMeetingRoot .sm-offcard { opacity: .95; border-color: #fecaca; background: #fff5f5; }
#studentMeetingRoot .sm-offcard:hover { border-color: #fca5a5; }
#studentMeetingRoot .sm-offcard--noroom { border-color: #e2e8f0; background: #f8fafc; }
#studentMeetingRoot .sm-offcard__avatar { background: #fee2e2; color: #b91c1c; }
#studentMeetingRoot .sm-offcard--noroom .sm-offcard__avatar { background: #e2e8f0; color: #475569; }
#studentMeetingRoot .sm-offcard__status { color: #b91c1c; }
#studentMeetingRoot .sm-offcard--noroom .sm-offcard__status { color: #475569; }
#studentMeetingRoot .sm-offcard__dot { background: #dc2626; animation: none; }
#studentMeetingRoot .sm-offcard--noroom .sm-offcard__dot { background: #94a3b8; }

.sm-tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; vertical-align: middle; white-space: nowrap; }
.sm-tag--off { background: #fee2e2; color: #b91c1c; }
.sm-tag--sub { background: #ede9fe; color: #6d28d9; }
.sm-slot-sep { height: 1px; background: #e2e8f0; margin: 10px 0; }
.sm-muted { font-size: 12px; color: #94a3b8; font-style: italic; }
.sm-note { font-size: 12px; color: #9a3412; margin: 8px 2px 0; display: flex; gap: 6px; align-items: flex-start; }
.sm-note i { margin-top: 2px; }

/* phones */
@media (max-width: 640px) {
  .ag__row { grid-template-columns: 78px minmax(0, 1fr); gap: 0 12px; }
  .ag__rail { padding-right: 10px; }
  .ag__day { font-size: 13px; }
  .ag__date { font-size: 11px; }
  .ag__cardbody { padding: 10px 12px 12px; }
  .ag__slot { padding: 9px 10px; }
}

/* === tansinh sm-v3 END === */
/* === tansinh sm-v4 BEGIN (10 Oct 2026) — GV Breakout đang trực === */
.sm-section--onduty .sm-section__label { color: #0f766e; }
#studentMeetingRoot .sm-section--onduty .tmc-card { border-color: #a7f3d0; background: #fff; }
#studentMeetingRoot .sm-section--onduty .tmc-card:hover { border-color: #5eead4; }
